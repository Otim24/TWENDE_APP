name: twende_passenger_app
description: The passenger app for Twende.
version: 1.0.0+1
environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  sentry_flutter: ^9.21.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^12.1.0
  dio: ^5.4.0
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  flutter_secure_storage: ^9.0.0
  logger: ^2.0.0
  pinput: ^4.0.0
  google_maps_flutter: ^2.14.0
  qr_flutter: ^4.1.0
  share_plus: ^7.2.0
  gal: ^2.3.0
  permission_handler: ^11.3.0
  path_provider: ^2.1.2
  maplibre_gl: ^0.25.0
  web_socket_channel: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: twende-flutter
  org: axeon-systems-security